services:
  # PHP Application
  laravel8:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: laravel8-php7.4
    container_name: laravel8
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    deploy:
        resources:
            limits:
                memory: 2G
            reservations:
                memory: 1G

  # Nginx Web Server
  nginx-laravel8:
    image: nginx:alpine
    container_name: nginx-laravel8
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    depends_on:
      - laravel8
    deploy:
        resources:
            limits:
                memory: 2G
            reservations:
                memory: 1G